services:
  backend:
    build: .
    ports:
      - "80:8080"
    environment:
      OEM_COMMAND: "${OEM_COMMAND:-}"
      IMAGE_PATH: /images/firmware.hex
    volumes:
      - ./images:/images:ro
      - ./logs:/logs
    restart: "no"
  legacy:
    build: ./legacy-ssl
    ports:
      - "443:443"
    depends_on:
      - backend
    volumes:
      - legacy-cert:/cert
    restart: "no"
  lan-dns-dhcp:
    profiles: ["lan"]
    build: ./lan-services
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      LAN_INTERFACE: "${LAN_INTERFACE:-}"
      UPDATE_SERVER_IP: "${UPDATE_SERVER_IP:-}"
      DHCP_RANGE_START: "${DHCP_RANGE_START:-}"
      DHCP_RANGE_END: "${DHCP_RANGE_END:-}"
      DHCP_NETMASK: "${DHCP_NETMASK:-}"
      DHCP_ROUTER: "${DHCP_ROUTER:-}"
      UPSTREAM_DNS: "${UPSTREAM_DNS:-}"
    volumes:
      - ./lan-services/state:/var/lib/misc
    depends_on:
      - backend
    restart: "no"
volumes:
  legacy-cert:
